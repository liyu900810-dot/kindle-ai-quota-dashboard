<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Kindle AI Quota Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dashboard" aria-label="Kindle AI Quota Dashboard">
    <header class="dashboard-header">
      <div>
        <p class="eyebrow">KINDLE AI QUOTA DASHBOARD</p>
        <p class="header-status" id="dataStatus">等待实时数据</p>
      </div>
      <div class="calendar" aria-label="日期和时间">
        <strong class="header-time mono" id="clock">--:--</strong>
        <span id="solarDate">----年--月--日 星期-</span>
        <span id="lunarDate">农历日期</span>
      </div>
    </header>

    <div class="data-alert" id="dataAlert" role="status"></div>

    <section class="summary-grid" aria-label="时间和天气">
      <article class="panel datetime-card">
        <p class="card-label">NOW</p>
        <strong class="hero-time mono" id="dtTime">--:--</strong>
        <span class="solar-line" id="dtDate">----年--月--日 星期-</span>
        <span class="lunar-line" id="dtLunar">农历日期</span>
      </article>

      <article class="panel weather-card">
        <div class="weather-card-header">
          <p class="card-label">WEATHER</p>
          <a id="weatherSource" href="https://open-meteo.com/" rel="noopener">Weather: Open-Meteo</a>
        </div>
        <div class="weather-heading">
          <span class="weather-icon" id="weatherIcon" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="img" focusable="false">
              <circle cx="24" cy="24" r="8"></circle>
              <path d="M24 4v7M24 37v7M4 24h7M37 24h7M9.9 9.9l5 5M33.1 33.1l5 5M38.1 9.9l-5 5M14.9 33.1l-5 5"></path>
            </svg>
          </span>
          <div class="weather-title">
            <strong id="weatherCity">扬州</strong>
            <span id="weatherDescription">Sunny</span>
          </div>
        </div>
        <div class="weather-grid">
          <div><span>温度</span><strong id="weatherTemp">35 C</strong></div>
          <div><span>体感</span><strong id="weatherFeels">体感 42 C</strong></div>
          <div><span>湿度</span><strong id="weatherHumidity">湿度 56%</strong></div>
          <div><span>风速</span><strong id="weatherWind">风 8 km/h</strong></div>
        </div>
      </article>
    </section>

    <section class="panel quota-card" id="cardCodex" aria-label="Codex quota">
      <div class="quota-header">
        <p class="card-label">QUOTA</p>
        <strong class="provider-name">Codex</strong>
      </div>
      <div class="q-row">
        <div class="q-label">
          <span>周</span>
          <strong class="q-pct mono">24% used</strong>
        </div>
        <div class="q-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="24">
          <div class="q-bar-fill" style="width:24%"></div>
        </div>
        <p class="q-refresh mono">Reset: 08-05 13:13</p>
      </div>
    </section>

    <section class="panel quote-card" id="quoteCard" hidden aria-label="Quote">
      <p class="card-label">QUOTE</p>
      <p class="quote-text" id="quoteText"></p>
      <p class="quote-source" id="quoteSource"></p>
    </section>

    <footer class="footer">
      <span>更新: <time id="updatedAt">2026-07-30 16:35</time></span>
      <span>每 3 分钟自动刷新 · 点击屏幕关闭</span>
      <span class="visually-hidden" id="relTime"></span>
    </footer>
  </main>

  <script src="data.js"></script>
  <script src="live-endpoint.js"></script>
  <script src="dashboard-runtime.js?v=20260730"></script>
</body>
</html>
